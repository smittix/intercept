# Based on #406 by @JonanOribe
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

template: |
  ## What's Changed
  $CHANGES

categories:
  - title: "💥 Breaking Changes"
    label: "breaking-change"
  - title: "🚀 Features"
    label: "enhancement"
  - title: "🐛 Bug Fixes"
    label: "bug"
  - title: "🔄 Dependency Updates"
    label: "dependencies"
  - title: "🧰 Maintenance"
    label: "chore"
  - title: "📦 Others"

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"

exclude-labels:
  - "skip-changelog"
  - "internal"
