name: CI

# Pushes to a PR branch fired both triggers, running every job twice.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR or branch instead of letting them
# pile up and starve each other of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ["a-l", "m-z"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Run tests (${{ matrix.group }})
        run: |
          if [ "${{ matrix.group }}" = "a-l" ]; then
            pytest tests/test_[a-l]*.py --tb=short -q --timeout=120 --timeout-method=thread
          else
            pytest tests/test_[m-z]*.py --tb=short -q --timeout=120 --timeout-method=thread
          fi
